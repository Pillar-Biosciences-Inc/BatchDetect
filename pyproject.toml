[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batchdetect"
version = "0.1.0"
description = "Detecting Batch Heterogeneity"
authors = [
    { name="Austin Talbot", email="talbota@pillarbiosci.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "tqdm",
    "igraph",
    "matplotlib",
    "leidenalg",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.9",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "black==23.12.1",
]

[project.urls]
Homepage = "https://github.com/Pillar-Biosciences-Inc/BatchDetect"

[tool.ruff]
line-length = 80
# Keep this at your support floor; raise only if you use newer syntax.
target-version = "py311"
extend-exclude = ["*.ipynb","build", "dist", ".venv", ".eggs"]

[tool.ruff.lint]
# Lint + import sorting only.
select = ["E", "F", "I"]
# Avoid conflicts with Black (long lines, trailing commas, string concat).
ignore = ["E501", "COM812", "ISC001"]

[tool.ruff.lint.isort]
known-first-party = ["bystrocov"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 80
target-version = ["py311"]
extend-exclude = "\\.ipynb$"
